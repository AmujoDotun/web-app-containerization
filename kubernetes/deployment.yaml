apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalable-web-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scalable-web-service
  template:
    metadata:
      labels:
        app: scalable-web-service
    spec:
      containers:
        - name: scalable-web-service
          image: 056616009733.dkr.ecr.us-west-2.amazonaws.com/scalable-web-service-repo:main-2  # Placeholder
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10